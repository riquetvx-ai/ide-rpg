<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Idle RPG Online V3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d16;color:#eee;font:14px Arial}button,input{font:inherit;border-radius:9px;border:1px solid #33415a;padding:10px;background:#182238;color:white}button{cursor:pointer}.primary{background:#684cff}.box{max-width:1250px;margin:auto;padding:12px}.panel{background:#111a2a;border:1px solid #2d3b53;border-radius:14px;padding:12px;margin-bottom:10px}.auth{max-width:430px;margin:8vh auto}.heroes{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.heroes button{font-size:11px}.heroes .sel{border-color:#a88cff;background:#35265e}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:1fr 330px;gap:10px}.game{position:relative;background:#101722;border-radius:12px;overflow:hidden}.game canvas{width:100%;display:block}.hud{position:absolute;top:8px;left:8px;background:#07101dcc;padding:8px;border-radius:9px}.bar{width:190px;height:7px;background:#29344a;margin:4px 0;border-radius:9px}.bar i{display:block;height:100%;background:#ff5268}.xp i{background:#8977ff}.controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.tabs{display:flex;gap:5px;overflow:auto}.list{display:grid;gap:6px;max-height:300px;overflow:auto}.row{display:flex;justify-content:space-between;gap:8px;padding:8px;background:#182338;border-radius:9px}.chat{height:170px;overflow:auto;background:#080d15;padding:8px}.small{color:#9eabc0;font-size:12px}.gold{color:#ffd65b}@media(max-width:850px){.layout{grid-template-columns:1fr}.heroes{grid-template-columns:repeat(5,1fr)}} 
</style></head><body>
<div id="auth" class="box auth panel"><h1>⚔️ Idle RPG Online V3</h1><p class="small">Mundo online • mapas • combate • equipamentos • PvP</p><input id="user" placeholder="Usuário"><input id="pass" type="password" placeholder="Senha"><div id="heroes" class="heroes"></div><p><button class="primary" onclick="register()">Criar conta</button> <button onclick="login()">Entrar</button></p><div id="msg"></div></div>
<div id="app" class="box" style="display:none"><div class="top panel"><div><b>⚔️ Idle RPG Online V3</b><div class="small"><span id="who"></span> • <span id="role"></span> • <span id="online">0</span> online</div></div><div>💰 <span class="gold" id="gold">0</span> • ⭐ <span id="level">1</span> • 🏆 <span id="rating">1000</span> <button onclick="logout()">Sair</button></div></div>
<div class="layout"><div><div class="game"><canvas id="c" width="1000" height="560"></canvas><div class="hud"><b id="hero">Arkan</b><div class="bar"><i id="hp"></i></div><div class="small">❤️ <span id="hpv"></span>/<span id="maxhp"></span></div><div class="bar xp"><i id="xp"></i></div></div></div>
<div class="controls"><button class="primary" onclick="attack()">⚔️ Atacar</button><button onclick="skill()">✨ Habilidade</button><button onclick="heal()">❤️ Curar</button><button onclick="travel()">🗺️ Viajar</button><button onclick="save()">💾 Salvar</button></div>
<div class="panel"><div class="tabs"><button onclick="tab('battle')">⚔️ Batalha</button><button onclick="tab('inv')">🎒 Inventário</button><button onclick="tab('shop')">🏪 Loja</button><button onclick="tab('quest')">📜 Missões</button></div><p id="battle">Explore o mapa, clique para andar e ataque para enfrentar monstros.</p><div id="inv" style="display:none"></div><div id="shop" style="display:none"></div><div id="quest" style="display:none"></div></div></div>
<div><div class="panel"><b>📊 Personagem</b><div class="row"><span>Ataque</span><b id="damage"></b></div><div class="row"><span>Defesa</span><b id="defense"></b></div><div class="row"><span>XP</span><b id="xpv"></b></div><button onclick="skill()">✨ Gastar ponto de habilidade</button></div>
<div class="panel"><b>🏆 PvP</b><button class="primary" onclick="pvp()">⚔️ Procurar adversário</button><div id="rank" class="list"></div></div>
<div class="panel"><b>💬 Chat global</b><div id="chat" class="chat"></div><input id="chatin" placeholder="Mensagem..." onkeydown="if(event.key==='Enter')chat()"><button onclick="chat()">Enviar</button></div></div></div></div>
<script>
const $=x=>document.getElementById(x);let me=null,token=localStorage.getItem("rpgv3"),heroSel="Arkan",ws,monster,others=[];
const H={Arkan:["⚔️","Guerreiro"],Luna:["🏹","Arqueira"],Elyra:["🔮","Maga"],Kael:["🗡️","Assassino"],Doran:["🛡️","Paladino"]};
const Z={vila:["Vila Inicial",1],floresta:["Floresta Sombria",3],caverna:["Caverna de Ferro",6],deserto:["Deserto Vermelho",10],chefe:["Trono do Dragão",15]};
const M={vila:["Slime Verde",90,7,25,18],floresta:["Lobo Sombrio",180,14,55,38],caverna:["Golem de Ferro",420,28,120,85],deserto:["Escorpião Rubro",700,40,220,160],chefe:["Dragão Ancião",2500,85,1000,1000]};
$("heroes").innerHTML=Object.entries(H).map(([n,v])=>`<button id=h${n} onclick="heroSel='${n}';drawHeroes()">${v[0]}<br>${n}<br><span class=small>${v[1]}</span></button>`).join("");
function drawHeroes(){Object.keys(H).forEach(n=>$("h"+n).className=n==heroSel?"sel":"")}drawHeroes();
async function api(u,o={}){o.headers={...(o.headers||{}),"Content-Type":"application/json"};if(token)o.headers.Authorization="Bearer "+token;let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||"Erro");return d}
async function register(){try{let d=await api("/api/register",{method:"POST",body:JSON.stringify({username:$("user").value,password:$("pass").value,hero:heroSel})});token=d.token;localStorage.setItem("rpgv3",token);me=d.user;start()}catch(e){$("msg").textContent=e.message}}
async function login(){try{let d=await api("/api/login",{method:"POST",body:JSON.stringify({username:$("user").value,password:$("pass").value})});token=d.token;localStorage.setItem("rpgv3",token);me=d.user;start()}catch(e){$("msg").textContent=e.message}}
async function start(){$("auth").style.display="none";$("app").style.display="block";render();connect();rank();shop();quest();draw()}
async function boot(){if(token)try{me=await api("/api/me");start();return}catch{}}
function logout(){localStorage.removeItem("rpgv3");location.reload()}
function render(){$("who").textContent=me.username;$("role").textContent=me.role;$("gold").textContent=me.gold;$("level").textContent=me.level;$("rating").textContent=me.rating;$("hero").textContent=H[me.hero][0]+" "+me.hero;$("damage").textContent=me.damage;$("defense").textContent=me.defense;$("xpv").textContent=me.xp;$("hpv").textContent=me.hp;$("maxhp").textContent=me.maxhp;$("hp").style.width=(me.hp/me.maxhp*100)+"%";$("xp").style.width=(me.xp/(me.level*100)*100)+"%";$("inv").innerHTML=(me.inventory||[]).map(i=>`<div class=row><span>${i.name}<br><small>${i.rarity}</small></span><b>+${i.power}</b></div>`).join("")||"<p class=small>Inventário vazio.</p>"}
function tab(n){["battle","inv","shop","quest"].forEach(x=>$(x).style.display=x==n?"block":"none")}
function log(x){$("battle").innerHTML=x}
function spawn(){let d=M[me.map];monster={name:d[0],hp:d[1],maxhp:d[1],damage:d[2],xp:d[3],gold:d[4],x:700,y:300}}
function attack(){if(!monster)spawn();let dmg=Math.max(1,me.damage+Math.floor(Math.random()*12));if(Math.random()<.12)dmg*=2;monster.hp-=dmg;if(monster.hp<=0){me.gold+=monster.gold;me.xp+=monster.xp;while(me.xp>=me.level*100){me.xp-=me.level*100;me.level++;me.skillpoints++;}log("🏆 "+monster.name+" derrotado! +"+monster.xp+" XP e +"+monster.gold+" ouro.");monster=null;save()}else{me.hp=Math.max(0,me.hp-Math.max(1,monster.damage-me.defense));log("⚔️ Você causou <b>"+dmg+"</b> de dano em "+monster.name+".");if(me.hp<=0){me.hp=Math.floor(me.maxhp/2);me.map="vila";log("💀 Você caiu e voltou para a Vila.")}}render();draw()}
async function skill(){if(me.skillpoints>0){me=await api("/api/skill",{method:"POST"});log("✨ Habilidade evoluída!");render();return}if(!monster)spawn();let dmg=Math.floor(me.damage*2);monster.hp-=dmg;me.mana=Math.max(0,(me.mana||30)-20);log("✨ "+H[me.hero][1]+" causou "+dmg+" de dano!");if(monster.hp<=0){me.gold+=monster.gold*2;me.xp+=monster.xp*2;monster=null;log("🔥 Vitória especial! Recompensa dobrada.")}render();draw()}
function heal(){me.hp=Math.min(me.maxhp,me.hp+Math.floor(me.maxhp*.3));render()}
function travel(){let a=Object.keys(Z),i=a.indexOf(me.map),n=a[(i+1)%a.length];if(me.level<Z[n][1])return log("🔒 Precisa do nível "+Z[n][1]+" para "+Z[n][0]);me.map=n;me.x=500;me.y=300;monster=null;log("🗺️ Você chegou em "+Z[n][0]);send();draw();save()}
async function save(){try{me=await api("/api/save",{method:"POST",body:JSON.stringify(me)});render()}catch(e){log(e.message)}}
async function shop(){let a=await api("/api/items");$("shop").innerHTML=a.map(i=>`<div class=row><span>${i.name}<br><small>${i.rarity} • +${i.power}</small></span><button onclick="buy('${i.id}')">💰 ${i.price}</button></div>`).join("")}
async function buy(id){try{me=await api("/api/buy",{method:"POST",body:JSON.stringify({itemId:id})});render();log("🛒 Item comprado!")}catch(e){log(e.message)}}
function quest(){$("quest").innerHTML="<div class=row><span>⚔️ Derrote monstros</span><b>XP + Ouro</b></div><div class=row><span>🗺️ Explore as áreas</span><b>Recompensa</b></div><div class=row><span>🐉 Derrote o Dragão</span><b>1000 ouro</b></div>"}
async function rank(){let a=await api("/api/ranking");$("rank").innerHTML=a.map((x,i)=>`<div class=row><span>#${i+1} ${x.username}<br><small>${x.hero} • Nv ${x.level}</small></span><b>🏆${x.rating}</b></div>`).join("")}
async function pvp(){try{let r=await api("/api/pvp",{method:"POST"});if(r.error)return log(r.error);me=r.user;render();rank();log((r.win?"🏆 VITÓRIA":"💀 DERROTA")+" contra "+r.opponent+" • "+r.rating+" rating")}catch(e){log(e.message)}}
function connect(){ws=new WebSocket((location.protocol=="https:"?"wss":"ws")+"://"+location.host);ws.onopen=()=>ws.send(JSON.stringify({type:"hello",id:me.id,username:me.username,x:me.x||500,y:me.y||300,map:me.map,hero:me.hero}));ws.onmessage=e=>{let x=JSON.parse(e.data);if(x.type=="online")$("online").textContent=x.count;if(x.type=="world")others=x.players;if(x.type=="chat"){let d=document.createElement("div");d.textContent=x.user+": "+x.text;$("chat").appendChild(d);$("chat").scrollTop=99999}}}
function send(){if(ws&&ws.readyState==1)ws.send(JSON.stringify({type:"move",x:me.x,y:me.y,map:me.map}))}
function chat(){let t=$("chatin").value.trim();if(t&&ws?.readyState==1)ws.send(JSON.stringify({type:"chat",text:t}));$("chatin").value=""}
$("c").onclick=e=>{let r=$("c").getBoundingClientRect();me.x=(e.clientX-r.left)*1000/r.width;me.y=(e.clientY-r.top)*560/r.height;send();draw()}
function draw(){let c=$("c"),x=c.getContext("2d");x.fillStyle=me.map=="deserto"?"#684723":me.map=="caverna"?"#292936":me.map=="chefe"?"#411a24":"#173c28";x.fillRect(0,0,1000,560);x.fillStyle="#fff";x.font="bold 22px Arial";x.fillText(Z[me.map][0],20,32);others.filter(p=>p.id!=me.id&&p.map==me.map).forEach(p=>{x.fillStyle="#54a7ff";x.beginPath();x.arc(p.x,p.y,14,0,7);x.fill();x.fillStyle="#fff";x.font="12px Arial";x.fillText(p.username,p.x-25,p.y-20)});if(monster){x.fillStyle="#d55";x.beginPath();x.arc(monster.x,monster.y,monster.name.includes("Dragão")?35:23,0,7);x.fill();x.fillStyle="#fff";x.fillText(monster.name,monster.x-35,monster.y-35)}x.fillStyle="#a991ff";x.beginPath();x.arc(me.x||500,me.y||300,18,0,7);x.fill();x.fillStyle="#fff";x.fillText(H[me.hero][0]+" "+me.username,(me.x||500)-35,(me.y||300)-25)}
addEventListener("keydown",e=>{if(!me)return;let d=25,k=e.key.toLowerCase();if(k=="w"||k=="arrowup")me.y-=d;if(k=="s"||k=="arrowdown")me.y+=d;if(k=="a"||k=="arrowleft")me.x-=d;if(k=="d"||k=="arrowright")me.x+=d;if(k==" ")attack();send();draw()});boot();
</script></body></html>
