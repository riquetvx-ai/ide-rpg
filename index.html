<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Idle RPG Online V4</title><style>
*{box-sizing:border-box}body{margin:0;background:#07101d;color:#eaf2ff;font-family:Arial,sans-serif;overflow:hidden}button,input{font:inherit}.hidden{display:none!important}
#login{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#18375a,#050b14 65%)}.card{width:min(430px,92vw);background:#0c1829ee;border:1px solid #355271;border-radius:18px;padding:24px;box-shadow:0 20px 60px #0008}.card h1{margin:0 0 5px;font-size:30px}.muted{color:#91a6c1;font-size:13px}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button,.btn{border:1px solid #38536f;background:#12243a;color:#dceaff;border-radius:10px;padding:10px 14px;cursor:pointer}.tabs button.active,.btn.primary{background:#2463a5;border-color:#4b91dc}.input{width:100%;margin:7px 0;padding:12px;border-radius:10px;border:1px solid #334d68;background:#07121f;color:white}.heroes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}.hero{padding:7px 3px;text-align:center;border:1px solid #29435e;border-radius:10px;background:#0a1625;cursor:pointer;font-size:11px}.hero.sel{border-color:#65b4ff;background:#143050}.hero .mini{font-size:24px;display:block}
#game{height:100vh;display:flex;flex-direction:column}.top{height:66px;background:#091522;border-bottom:1px solid #263d56;display:flex;align-items:center;gap:14px;padding:8px 14px}.brand{font-weight:800;font-size:18px;white-space:nowrap}.stat{min-width:110px}.bar{height:8px;background:#172536;border-radius:20px;overflow:hidden;margin-top:4px}.fillhp{height:100%;background:#e74b52}.fillmp{height:100%;background:#438eea}.topright{margin-left:auto;display:flex;gap:7px}.main{flex:1;display:flex;min-height:0}.world{position:relative;flex:1;min-width:0;background:#182f24}.world canvas{display:block;width:100%;height:100%}.side{width:290px;background:#091522;border-left:1px solid #263d56;padding:12px;overflow:auto}.panel{background:#0d1b2c;border:1px solid #263e58;border-radius:12px;padding:10px;margin-bottom:10px}.panel h3{margin:0 0 8px;font-size:14px}.enemy{display:flex;justify-content:space-between;align-items:center}.enemy strong{font-size:15px}.enemybar{height:10px;background:#222c36;border-radius:8px;overflow:hidden;margin:6px 0 8px}.enemybar i{display:block;height:100%;background:#d74747}.skill{width:100%;padding:10px;border-radius:9px;background:#47266b;color:#fff;border:1px solid #7c4ab0;cursor:pointer}.log{height:120px;overflow:auto;font-size:12px;color:#9fb3cb}.bottom{height:46px;background:#091522;border-top:1px solid #263d56;display:flex;align-items:center;padding:0 12px;gap:8px;font-size:12px}.chat{flex:1;display:flex;gap:6px}.chat input{flex:1;padding:7px;background:#07121f;border:1px solid #304860;color:white;border-radius:8px}.float{position:absolute;pointer-events:none;font-weight:900;text-shadow:0 2px 5px #000;animation:float 900ms ease-out forwards}.dmg{color:#ffda5e;font-size:18px}.crit{color:#ff6b6b;font-size:23px}.heal{color:#69ff9a}@keyframes float{0%{transform:translate(-50%,0) scale(.7);opacity:0}15%{opacity:1}100%{transform:translate(-50%,-55px) scale(1.15);opacity:0}}.hit{animation:hit .22s linear}@keyframes hit{50%{filter:brightness(2)} }@media(max-width:850px){.side{width:235px}.brand{display:none}.stat{min-width:80px}}@media(max-width:650px){.side{display:none}.bottom{height:50px}.top{height:58px}.world{height:calc(100vh - 108px)}}
</style></head><body>
<div id="login"><div class="card"><h1>⚔️ Idle RPG Online</h1><div class="muted">V4 • mapa e combate visual</div><div class="tabs"><button id="tabLogin" class="active">Entrar</button><button id="tabReg">Criar conta</button></div><input id="user" class="input" placeholder="Usuário"><input id="pass" class="input" type="password" placeholder="Senha"><div id="heroes" class="heroes"></div><button id="go" class="btn primary" style="width:100%">Entrar</button><div id="msg" class="muted" style="margin-top:10px"></div></div></div>
<div id="game" class="hidden"><header class="top"><div class="brand">⚔️ IDLE RPG</div><div class="stat"><b id="uname">Jogador</b><div>Lv <span id="lvl">1</span> • XP <span id="xp">0</span></div></div><div class="stat">HP <span id="hpText">0/0</span><div class="bar"><div id="hp" class="fillhp"></div></div></div><div class="stat">MP <span id="mpText">0/0</span><div class="bar"><div id="mp" class="fillmp"></div></div></div><div class="topright"><button class="btn" id="save">💾</button><button class="btn" id="logout">Sair</button></div></header><main class="main"><section class="world"><canvas id="cv"></canvas></section><aside class="side"><div class="panel"><h3>👹 Inimigo</h3><div id="enemyBox" class="enemy"><span>Selecione um monstro</span></div></div><div class="panel"><h3>🧙 Personagem</h3><div id="heroInfo"></div><button id="skill" class="skill" style="margin-top:8px">✨ Habilidade</button></div><div class="panel"><h3>🗺️ Áreas</h3><div id="zones"></div></div><div class="panel"><h3>📜 Combate</h3><div id="log" class="log"></div></div></aside></main><footer class="bottom"><span>🟢 Online: <b id="online">1</b></span><div class="chat"><input id="chatInput" placeholder="Digite no chat..."><button class="btn" id="chatSend">Enviar</button></div></footer></div>
<script>
const $=id=>document.getElementById(id);let mode='login',hero='Arkan',token='',me=null,classes={},zones={},monsters={},enemy=null,enemyHp=0,attackTimer=0,ws=null,players=[];const cv=$('cv'),ctx=cv.getContext('2d');
const colors={Arkan:'#5ba5ff',Luna:'#72e58a',Elyra:'#c987ff',Kael:'#ff687a',Doran:'#f2c85c'};
async function api(u,o={}){o.headers={...(o.headers||{}),'Content-Type':'application/json'};if(token)o.headers.Authorization='Bearer '+token;let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'Erro');return d}
async function boot(){try{[classes,zones,monsters]=await Promise.all([api('/api/classes'),api('/api/zones'),api('/api/monsters')]);renderHeroes();renderZones()}catch(e){$('msg').textContent=e.message}}
function renderHeroes(){let names=Object.keys(classes);$('heroes').innerHTML=names.map(n=>`<div class="hero ${n===hero?'sel':''}" data-h="${n}"><span class="mini">${n==='Arkan'?'🛡️':n==='Luna'?'🏹':n==='Elyra'?'🔮':n==='Kael'?'🗡️':'⚜️'}</span>${n}<br><small>${classes[n].role}</small></div>`).join('');document.querySelectorAll('.hero').forEach(x=>x.onclick=()=>{hero=x.dataset.h;renderHeroes()})}
function renderZones(){let html=Object.entries(zones).map(([k,z])=>`<button class="btn" style="width:100%;margin:3px 0;text-align:left" onclick="changeZone('${k}')">${z.name} <small>Lv ${z.minLevel}</small></button>`).join('');$('zones').innerHTML=html}
function log(t){let d=document.createElement('div');d.textContent=t;$('log').prepend(d)}
$('tabLogin').onclick=()=>setMode('login');$('tabReg').onclick=()=>setMode('reg');function setMode(x){mode=x;$('tabLogin').classList.toggle('active',x==='login');$('tabReg').classList.toggle('active',x==='reg');$('go').textContent=x==='login'?'Entrar':'Criar conta'}
$('go').onclick=async()=>{try{let u=$('user').value.trim(),p=$('pass').value;let d=await api(mode==='login'?'/api/login':'/api/register',{method:'POST',body:JSON.stringify({username:u,password:p,hero})});token=d.token;me=d.user;start()}catch(e){$('msg').textContent=e.message}};
async function start(){ $('login').classList.add('hidden');$('game').classList.remove('hidden');updateUI();connect();resize();chooseEnemy();log('Bem-vindo! Clique em um monstro para atacar.');requestAnimationFrame(loop)}
function updateUI(){if(!me)return;$('uname').textContent=me.username+' • '+me.hero;$('lvl').textContent=me.level;$('xp').textContent=me.xp;$('hpText').textContent=me.hp+'/'+me.maxhp;$('mpText').textContent=me.mana+'/'+me.maxmana;$('hp').style.width=(me.hp/me.maxhp*100)+'%';$('mp').style.width=(me.mana/me.maxmana*100)+'%';$('online').textContent=players.length||1;$('heroInfo').innerHTML=`<b>${me.hero}</b> — ${classes[me.hero]?.role||''}<br>⚔️ Dano: ${me.damage}<br>🛡️ Defesa: ${me.defense}<br>💰 Ouro: ${me.gold}<br>⭐ Nível: ${me.level}`}
function chooseEnemy(){let k=me?.map||'vila';let m=monsters[k]||monsters.vila;enemy={...m,x:cv.clientWidth*.58,y:cv.clientHeight*.48};enemyHp=m.hp;updateEnemyUI()}
function updateEnemyUI(){if(!enemy){$('enemyBox').innerHTML='<span>Selecione um monstro</span>';return}let pct=Math.max(0,enemyHp/enemy.hp*100);$('enemyBox').innerHTML=`<div style="width:100%"><strong>${enemy.name}</strong><div class="enemybar"><i style="width:${pct}%"></i></div><small>HP ${Math.max(0,Math.ceil(enemyHp))}/${enemy.hp}</small></div>`}
function attack(){if(!enemy||enemyHp<=0)return;let crit=Math.random()<.12,dmg=Math.max(1,me.damage+(Math.random()*10-5));if(crit)dmg*=2;enemyHp-=dmg;me.mana=Math.max(0,me.mana-1);floatText(enemy.x,enemy.y-65,Math.round(dmg),crit?'crit':'dmg');log(`${crit?'CRÍTICO! ':''}${me.hero} causou ${Math.round(dmg)} de dano.`);if(enemyHp<=0){let xp=enemy.xp,g=enemy.gold;me.xp+=xp;me.gold+=g;log(`☠️ ${enemy.name} derrotado! +${xp} XP +${g} ouro.`);if(me.xp>=me.level*100){me.xp-=me.level*100;me.level++;me.skillpoints=(me.skillpoints||0)+1;me.maxhp+=10;me.hp=me.maxhp;log('⬆️ Você subiu de nível!')}setTimeout(chooseEnemy,700)}else{me.hp=Math.max(1,me.hp-enemy.damage*.18);floatText(0,0,Math.ceil(enemy.damage*.18),'dmg');}updateUI();updateEnemyUI();}
$('skill').onclick=async()=>{if((me.skillpoints||0)<1){log('Você não tem ponto de habilidade.');return}try{let d=await api('/api/skill',{method:'POST',body:'{}'});me=d;log('✨ Habilidade aprimorada!');updateUI()}catch(e){log(e.message)}};
function changeZone(k){if(me.level<zones[k].minLevel){log('Nível insuficiente para esta área.');return}me.map=k;chooseEnemy();log('🗺️ Você entrou em '+zones[k].name);send({type:'move',x:me.x,y:me.y,map:k})}
function floatText(x,y,n,c){if(!x&&!y)return;let e=document.createElement('div');e.className='float '+c;e.textContent=(c==='crit'?'CRÍTICO! ':'-')+n;e.style.left=x+'px';e.style.top=y+'px';$('game').appendChild(e);setTimeout(()=>e.remove(),900)}
function resize(){let r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);if(enemy){enemy.x=r.width*.58;enemy.y=r.height*.48}}
window.addEventListener('resize',resize);
cv.addEventListener('click',e=>{let r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(enemy&&Math.hypot(x-enemy.x,y-enemy.y)<75)attack();else{me.x=Math.max(50,Math.min(r.width-50,x));me.y=Math.max(80,Math.min(r.height-60,y));send({type:'move',x:me.x,y:me.y,map:me.map})}});
window.addEventListener('keydown',e=>{if(!$('game').classList.contains('hidden')){let s=8;if(e.key==='ArrowUp'||e.key==='w')me.y-=s;if(e.key==='ArrowDown'||e.key==='s')me.y+=s;if(e.key==='ArrowLeft'||e.key==='a')me.x-=s;if(e.key==='ArrowRight'||e.key==='d')me.x+=s;me.x=Math.max(35,Math.min(cv.clientWidth-35,me.x));me.y=Math.max(65,Math.min(cv.clientHeight-35,me.y));send({type:'move',x:me.x,y:me.y,map:me.map})}});
function draw(){let w=cv.clientWidth,h=cv.clientHeight;ctx.clearRect(0,0,w,h);let grad=ctx.createLinearGradient(0,0,0,h);grad.addColorStop(0,'#244b35');grad.addColorStop(1,'#10271b');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);ctx.strokeStyle='#3b6849';for(let x=0;x<w;x+=45){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
// trees/rocks
for(let i=0;i<18;i++){let x=(i*137+70)%Math.max(w,300),y=(i*83+40)%Math.max(h,300);ctx.fillStyle='#0d2017';ctx.beginPath();ctx.arc(x,y,16,0,7);ctx.fill();ctx.fillStyle='#315e39';ctx.beginPath();ctx.arc(x,y-10,20,0,7);ctx.fill()}
if(enemy&&enemyHp>0)drawMonster(enemy.x,enemy.y,enemy.name);if(me)drawHero(me.x||w*.3,me.y||h*.55,me.hero,true);players.filter(p=>p.id&&p.id!==me.id&&p.map===me.map).forEach(p=>drawHero(p.x,p.y,p.hero,false));}
function drawHero(x,y,h,active){ctx.save();let c=colors[h]||'#fff';ctx.translate(x,y);ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(0,22,25,9,0,0,7);ctx.fill();ctx.fillStyle=c;ctx.beginPath();ctx.arc(0,-15,11,0,7);ctx.fill();ctx.fillStyle='#d8a07a';ctx.beginPath();ctx.arc(0,-19,7,0,7);ctx.fill();ctx.fillStyle=c;ctx.fillRect(-11,-5,22,28);ctx.strokeStyle='#f2f6ff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-8,18);ctx.lineTo(-11,31);ctx.moveTo(8,18);ctx.lineTo(11,31);ctx.stroke();if(h==='Arkan'||h==='Doran'){ctx.strokeStyle='#d9e4ef';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(13,2);ctx.lineTo(28,-18);ctx.stroke()}else if(h==='Luna'){ctx.strokeStyle='#e6c58a';ctx.lineWidth=3;ctx.beginPath();ctx.arc(16,2,13,-1.4,1.4);ctx.stroke()}else if(h==='Elyra'){ctx.fillStyle='#c987ff';ctx.beginPath();ctx.arc(17,-3,7,0,7);ctx.fill()}else{ctx.strokeStyle='#e8e8e8';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(12,3);ctx.lineTo(26,-8);ctx.moveTo(10,8);ctx.lineTo(24,18);ctx.stroke()}if(active){ctx.fillStyle='#fff';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillText(me.username,0,-40)}ctx.restore()}
function drawMonster(x,y,name){ctx.save();ctx.translate(x,y);ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(0,28,35,10,0,0,7);ctx.fill();let k=me.map;if(k==='chefe'){ctx.fillStyle='#8e3030';ctx.beginPath();ctx.arc(0,-8,30,0,7);ctx.fill();ctx.fillStyle='#e95b4e';ctx.beginPath();ctx.moveTo(-25,-25);ctx.lineTo(-45,-48);ctx.lineTo(-10,-35);ctx.moveTo(25,-25);ctx.lineTo(45,-48);ctx.lineTo(10,-35);ctx.fill()}else if(k==='caverna'){ctx.fillStyle='#737d89';ctx.fillRect(-30,-25,60,55);ctx.fillStyle='#333';ctx.fillRect(-18,-8,8,8);ctx.fillRect(10,-8,8,8)}else if(k==='deserto'){ctx.fillStyle='#c87832';ctx.beginPath();ctx.ellipse(0,5,38,18,0,0,7);ctx.fill();ctx.strokeStyle='#e9a657';ctx.lineWidth=6;ctx.beginPath();ctx.arc(0,5,38,3.3,6);ctx.stroke()}else{ctx.fillStyle=k==='floresta'?'#3e6d4c':'#53b95d';ctx.beginPath();ctx.arc(0,4,30,0,7);ctx.fill();ctx.fillStyle='#ffdc57';ctx.beginPath();ctx.arc(-10,0,5,0,7);ctx.arc(10,0,5,0,7);ctx.fill()}ctx.fillStyle='#fff';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillText(name,0,-50);ctx.restore()}
function loop(t){draw();requestAnimationFrame(loop)}
function connect(){try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>send({type:'hello',id:me.id,username:me.username,x:me.x||300,y:me.y||300,map:me.map||'vila',hero:me.hero});ws.onmessage=e=>{let d=JSON.parse(e.data);if(d.type==='online')$('online').textContent=d.count;if(d.type==='world'){players=d.players||[];updateUI()}if(d.type==='chat')log('💬 '+d.user+': '+d.text)} }catch(e){}}
function send(x){if(ws&&ws.readyState===1)ws.send(JSON.stringify(x))}
$('chatSend').onclick=()=>{let t=$('chatInput').value.trim();if(t){send({type:'chat',text:t});$('chatInput').value=''}};$('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('chatSend').click()});
$('save').onclick=async()=>{try{me=await api('/api/save',{method:'POST',body:JSON.stringify(me)});log('💾 Progresso salvo.')}catch(e){log('Erro ao salvar: '+e.message)}};$('logout').onclick=()=>location.reload();
boot();
</script></body></html>
